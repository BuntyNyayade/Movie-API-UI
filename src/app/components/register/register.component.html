<div class="register-page">

  <!-- ── Floating Neon Bubbles ── -->
  <div class="bubbles-container">
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
  </div>

  <!-- ── Register Card ── -->
  <div class="register-card">

    <!-- Header -->
    <h1 class="register-title">Register</h1>
    <p class="register-subtitle">Create your account to get started</p>

    <!-- Form -->
    <form [formGroup]="registerForm"  (ngSubmit)="register()">

      <!-- Inline Notification -->
      <div *ngIf="inlineNotification.show" class="inline-notification">
        {{ inlineNotification.text }}
      </div>

      <!-- Email -->
      <div class="field-group">
        <label for="email" class="field-label">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="you@example.com"
          class="field-input"
          required
        />
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="field-error">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Invalid email format.</span>
        </div>
      </div>

      <!-- Username -->
      <div class="field-group">
        <label for="username" class="field-label">Username</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="Choose a username"
          class="field-input"
          required
        />
        <div *ngIf="username.invalid && (username.dirty || username.touched)" class="field-error">
          <span *ngIf="username.errors?.['required']">Username is required.</span>
        </div>
      </div>

      <!-- Role -->
      <div class="field-group">
        <label for="role" class="field-label">Role</label>
        <input
          type="text"
          id="role"
          formControlName="role"
          placeholder="e.g. USER or ADMIN"
          class="field-input"
          required
        />
        <div *ngIf="role.invalid && (role.dirty || role.touched)" class="field-error">
          <span *ngIf="role.errors?.['required']">Role is required.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label for="password" class="field-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Min. 5 characters"
          class="field-input"
          required
        />
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="field-error">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 5 characters long.</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-register">Register</button>

    </form>

    <!-- Login Link -->
    <p class="login-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>

  </div>
</div>
