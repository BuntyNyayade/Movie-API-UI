<div class="register-page">

  <!-- ── Floating Neon Bubbles ── -->
  <div class="bubbles-container">
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
    <span class="bubble"></span>
  </div>

  <!-- ── Register Card ── -->
  <div class="register-card">

    <!-- Header -->
    <h1 class="register-title">Login</h1>
    <p class="register-subtitle">Create your account to get started</p>

    <!-- Form -->
    <form [formGroup]="loginForm"  (ngSubmit)="login()">

      <!-- Inline Notification -->
      <div *ngIf="inlineNotification.show" class="inline-notification">
        {{ inlineNotification.text }}
      </div>

      <!-- Email -->
      <div class="field-group">
        <label for="email" class="field-label">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="you@example.com"
          class="field-input"
          required
        />
        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="field-error">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Invalid email format.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label for="password" class="field-label">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Min. 5 characters"
          class="field-input"
          required
        />
        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="field-error">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">Password must be at least 5 characters long.</span>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-register">Login</button>

    </form>

    <!-- Login Link -->
    <p class="login-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>

  </div>
</div>
