<nav>
  <!-- Brand Logo -->
  <a routerLink="/" class="brand" (click)="closeMenu()">MovieApp</a>

  <button
    type="button"
    class="hamburger"
    [class.is-active]="isMenuOpen"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="primary-navigation"
    aria-label="Toggle navigation menu"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div id="primary-navigation" class="nav-menu" [class.is-open]="isMenuOpen">
    <!-- Center Nav Links -->
    <ul class="nav-links">
      <li>
        <a routerLink="/" class="nav-link" (click)="closeMenu()">Home</a>
      </li>
      <li class="dropdown-wrapper" [class.is-open]="isMoviesOpen">
        <button
          type="button"
          class="dropdown-trigger"
          [attr.aria-expanded]="isMoviesOpen"
          (click)="toggleMovies()"
        >
          Movies
        </button>
        <div class="dropdown-menu">
          <a routerLink="/show-movies" class="dropdown-item" (click)="closeMenu()">Show Movies</a>
          <a routerLink="/add-movie" class="dropdown-item" (click)="closeMenu()">Add Movie</a>
        </div>
      </li>
    </ul>

    <!-- Right Action Buttons -->
    <div class="nav-actions" *ngIf="!isLoggedIn()">
      <a routerLink="/login" class="btn-outline" (click)="closeMenu()">Login</a>
      <a routerLink="/register" class="btn-neon" (click)="closeMenu()">Register</a>

      <!-- Logged-in User Section -->
      <div class="user-section" >
        <span class="user-name" *ngIf="isLoggedIn()">{{name}}</span>
        <button class="btn-logout" *ngIf="isLoggedIn()" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>
